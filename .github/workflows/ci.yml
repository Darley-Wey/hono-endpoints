name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable release version'; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match pluginVersion'; exit 1; }

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build, test, package, and verify plugin
        run: ./gradlew test buildPlugin verifyPlugin verifyPluginProjectConfiguration --console=plain

      - name: Upload Plugin Verifier report
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v5
        with:
          name: hono-endpoints-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: build/reports/tests
          if-no-files-found: ignore

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: hono-endpoints-plugin
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  marketplace-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Marketplace token
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: test -n "$PUBLISH_TOKEN" || { echo 'Configure the PUBLISH_TOKEN repository secret'; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v5
        with:
          name: hono-endpoints-plugin
          path: dist
      - name: Publish verified ZIP to Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: bash
        run: |
          archives=(dist/*.zip)
          [[ ${#archives[@]} -eq 1 && -f "${archives[0]}" ]] || { echo 'Expected exactly one plugin ZIP'; exit 1; }
          ./gradlew publishPlugin -PreleaseArchive="${archives[0]}" -x buildPlugin -x signPlugin --no-configuration-cache --console=plain
